<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070918">
<title>Kometa</title>
<style>
:root {
  /* One visual world: deep space. Full-bleed canvas, DOM layers float above it,
     every control sits in the lower, thumb-reachable half of the screen. */
  --space: #070918;
  --space-2: #14174a;
  --ink: #f2f0ff;
  --ink-dim: #a3a5cf;
  --gold: #ffd166;
  --ice: #8ee8ff;
  --danger: #ff5d73;
  --panel: rgba(16, 18, 50, .86);
  --line: rgba(180, 186, 255, .18);
  --font-display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--space); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.layer { position: fixed; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
.layer > * { pointer-events: auto; }
.col { width: 100%; max-width: 440px; margin: 0 auto; padding: 0 20px; }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
.btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 100%; min-height: 58px; padding: 10px 18px; border-radius: 20px;
  font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: scale(.97); filter: brightness(1.12); }
.btn.primary { background: var(--gold); color: #2a1c00; min-height: 66px; font-size: 22px; box-shadow: 0 10px 34px rgba(255, 209, 102, .28); }
.btn.secondary { background: var(--panel); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.btn.ghost { background: rgba(16, 18, 50, .55); border: 1px solid var(--line); min-height: 50px; font-size: 16px; color: var(--ink); }
.btn .sub { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--ink-dim); letter-spacing: 0; }
.btn.primary .sub { color: #6b4a00; }
.btn:disabled { opacity: .55; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.chip {
  min-width: 46px; height: 46px; padding: 0 14px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 15px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.chip svg { width: 22px; height: 22px; }

/* ── home ── */
#home { background: linear-gradient(180deg, rgba(7,9,24,.55) 0%, rgba(7,9,24,.1) 34%, rgba(7,9,24,.55) 62%, rgba(7,9,24,.94) 100%); }
#home .top { display: flex; justify-content: flex-end; gap: 10px; padding-top: calc(var(--safe-t) + 14px); }
.brand { margin-top: 7vh; text-align: center; }
.wordmark {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 16vw, 76px); line-height: 1; letter-spacing: .14em; margin-right: -.14em;
  background: linear-gradient(100deg, #ffffff 10%, var(--ice) 55%, #b9a4ff 95%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 30px rgba(142, 232, 255, .35));
}
.tagline { margin: 14px 0 0; font-size: 17px; color: var(--ink); opacity: .92; text-wrap: balance; }
.home-fill { flex: 1; }
.stats { display: flex; justify-content: center; gap: 26px; margin-bottom: 18px; }
.stats div { text-align: center; }
.stats b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; }
.actions { display: flex; flex-direction: column; gap: 10px; padding-bottom: calc(var(--safe-b) + 22px); }
.pips { display: inline-flex; gap: 5px; margin-left: 8px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--ice); display: inline-block; }
.pips i.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-dim); }

/* ── hud ── */
#hud .top { display: flex; align-items: flex-start; justify-content: space-between; padding-top: calc(var(--safe-t) + 10px); }
#hud .side { width: 96px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#hud .side.r { align-items: flex-end; }
#hud > *, #hud .side > * { pointer-events: none; }
#hud #btnPause { pointer-events: auto; }
.sector-tag { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; padding: 14px 0 0 2px; white-space: nowrap; }
.score-box { text-align: center; pointer-events: none; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(7, 9, 24, .9); }
.mult { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 6px; border-radius: 15px; background: rgba(16,18,50,.7); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--ink-dim); transition: color .2s, border-color .2s; }
.mult.on { color: var(--gold); border-color: rgba(255, 209, 102, .5); }
.mult.pulse { animation: pulse .35s ease; }
.mult svg { width: 20px; height: 20px; transform: rotate(-90deg); }
.mult circle { fill: none; stroke-width: 3; }
.mult .bg { stroke: rgba(255,255,255,.14); }
.mult .fg { stroke: currentColor; stroke-linecap: round; stroke-dasharray: 50.3; }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
.banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s; }
.banner.show { opacity: 1; }
.banner b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 20px rgba(7,9,24,.9); }
.banner span { font-size: 15px; color: var(--ink); opacity: .85; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 3.5vh); display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 16px; pointer-events: none; opacity: 0; transition: opacity .25s; padding: 0 28px; }
.hint.show { opacity: 1; }
.hint p { margin: 0; text-align: left; max-width: 250px; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.25; text-wrap: balance; text-shadow: 0 2px 16px rgba(7,9,24,1), 0 0 4px rgba(7,9,24,1); }
.finger { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); position: relative; }
.finger::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--ink); }
.finger.hold { animation: fhold 1.1s ease-in-out infinite; }
.finger.release::after { animation: frel 1.1s ease-in-out infinite; }
@keyframes fhold { 0%, 100% { transform: scale(1); } 50% { transform: scale(.82); } }
@keyframes frel { 0%, 30% { transform: scale(1); opacity: 1; } 70%, 100% { transform: scale(.2); opacity: 0; } }
.warn { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 18px); text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #ff9db0; opacity: 0; transition: opacity .2s; pointer-events: none; }
.warn.show { opacity: 1; animation: blink .7s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }

/* ── sheets ── */
.sheet-wrap { justify-content: flex-end; background: linear-gradient(180deg, rgba(7,9,24,0) 0%, rgba(7,9,24,.6) 45%); pointer-events: auto; }
.sheet-wrap.dim { background: rgba(7, 9, 24, .72); }
.sheet {
  width: 100%; max-width: 480px; margin: 0 auto; padding: 22px 20px calc(var(--safe-b) + 20px);
  background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 30px 30px 0 0;
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; touch-action: pan-y;
  animation: rise .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes rise { from { transform: translateY(40px); } to { transform: translateY(0); } }
.eyebrow { margin: 0; text-align: center; font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.sheet h2 { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.ov-score { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.ov-best { margin: 0; text-align: center; font-size: 15px; color: var(--ink-dim); }
.ov-best.new { color: var(--gold); font-weight: 700; }
.squares { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; min-height: 22px; }
.squares i { width: 22px; height: 22px; border-radius: 6px; display: block; }
.squares .g { background: var(--gold); } .squares .p { background: #9b7bff; } .squares .d { background: #2b2e5c; }
.squares .x { background: none; width: auto; font-style: normal; font-size: 18px; line-height: 22px; }
.facts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.facts span { padding: 6px 12px; border-radius: 12px; background: rgba(255,255,255,.07); font-size: 14px; font-variant-numeric: tabular-nums; }
.note { margin: 0; text-align: center; font-size: 15px; color: var(--ice); font-weight: 600; text-wrap: balance; }
.how { display: flex; flex-direction: column; gap: 14px; margin: 4px 0 6px; padding: 0; list-style: none; }
.how li { display: flex; gap: 14px; align-items: center; font-size: 16px; line-height: 1.35; }
.how .ic { flex: none; width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.07); display: flex; align-items: center; justify-content: center; }
.how .ic svg { width: 28px; height: 28px; }
.tails { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tail { position: relative; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1.5px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 104px; }
.tail.sel { border-color: var(--gold); background: rgba(255, 209, 102, .08); }
.tail.locked { opacity: .62; }
.tail .sw { height: 10px; border-radius: 5px; }
.tail b { font-family: var(--font-display); font-size: 16px; }
.tail small { font-size: 12.5px; color: var(--ink-dim); line-height: 1.3; }
.tail .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: auto; }
.tail .bar i { display: block; height: 100%; background: var(--ice); }
.card-img { width: 56%; max-width: 240px; margin: 0 auto; border-radius: 16px; display: block; border: 1px solid var(--line); -webkit-touch-callout: default; }
.share-text { margin: 0; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.06); font-size: 15px; line-height: 1.5; white-space: pre-wrap; -webkit-user-select: text; user-select: text; text-align: center; }
@media (prefers-reduced-motion: reduce) { .sheet, .finger, .finger::after, .warn.show, .mult.pulse { animation: none !important; } }
@media (max-height: 640px) { .brand { margin-top: 3vh; } .ov-score { font-size: 50px; } .btn { min-height: 50px; } .btn.primary { min-height: 56px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Kometa"></canvas>

<!-- HUD -->
<section id="hud" class="layer" hidden>
  <div class="col top">
    <div class="side"><div class="sector-tag" id="hudSector"></div></div>
    <div class="score-box">
      <div class="score" id="hudScore">0</div>
      <div class="mult" id="hudMult"><svg viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="8"/><circle class="fg" id="hudRing" cx="10" cy="10" r="8"/></svg><span id="hudMultTxt">×1</span></div>
    </div>
    <div class="side r"><button class="chip" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button></div>
  </div>
  <div class="banner" id="banner"><b id="bannerT"></b><span id="bannerS"></span></div>
  <div class="hint" id="hint"><div class="finger" id="hintFinger"></div><p id="hintT"></p></div>
  <div class="warn" id="warn"></div>
</section>

<!-- Home -->
<section id="home" class="layer">
  <div class="col top">
    <button class="chip" id="btnLang" aria-label="Language">EN</button>
    <button class="chip" id="btnSound" aria-label="Sound"></button>
  </div>
  <div class="col brand">
    <h1 class="wordmark">KOMETA</h1>
    <p class="tagline" data-t="tagline"></p>
  </div>
  <div class="home-fill"></div>
  <div class="col">
    <div class="stats">
      <div><b id="hsBest">0</b><span data-t="best"></span></div>
      <div><b id="hsSector">1</b><span data-t="sectorMax"></span></div>
      <div><b id="hsStreak">0</b><span data-t="streak"></span></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnPlay"><span data-t="play"></span><span class="sub" data-t="playSub"></span></button>
      <button class="btn secondary" id="btnDaily"><span><span id="dailyTitle"></span><span class="pips" id="dailyPips"></span></span><span class="sub" id="dailySub"></span></button>
      <div class="row">
        <button class="btn ghost" id="btnTails" data-t="tails"></button>
        <button class="btn ghost" id="btnHow" data-t="how"></button>
      </div>
    </div>
  </div>
</section>

<!-- Pause -->
<section id="pause" class="layer sheet-wrap dim" hidden>
  <div class="sheet">
    <h2 data-t="paused"></h2>
    <button class="btn primary" id="btnResume" data-t="resume"></button>
    <div class="row">
      <button class="btn secondary" id="btnRestart" data-t="restart"></button>
      <button class="btn secondary" id="btnQuit" data-t="home"></button>
    </div>
    <button class="btn ghost" id="btnSound2"></button>
  </div>
</section>

<!-- Game over -->
<section id="over" class="layer sheet-wrap" hidden>
  <div class="sheet">
    <p class="eyebrow" id="ovMode"></p>
    <div class="ov-score" id="ovScore">0</div>
    <p class="ov-best" id="ovBest"></p>
    <div class="squares" id="ovSquares"></div>
    <div class="facts" id="ovFacts"></div>
    <p class="note" id="ovNote" hidden></p>
    <button class="btn primary" id="btnAgain"></button>
    <div class="row">
      <button class="btn secondary" id="btnShare" data-t="share"></button>
      <button class="btn secondary" id="btnHome" data-t="home"></button>
    </div>
  </div>
</section>

<!-- Tails -->
<section id="tails" class="layer sheet-wrap dim" hidden>
  <div class="sheet">
    <h2 data-t="tails"></h2>
    <p class="ov-best" data-t="tailsSub"></p>
    <div class="tails" id="tailGrid"></div>
    <button class="btn secondary" data-close="tails" data-t="done"></button>
  </div>
</section>

<!-- How to play -->
<section id="how" class="layer sheet-wrap dim" hidden>
  <div class="sheet">
    <h2 data-t="how"></h2>
    <ul class="how">
      <li><span class="ic"><svg viewBox="0 0 28 28" fill="none" stroke="#8ee8ff" stroke-width="2.2" stroke-linecap="round"><circle cx="18" cy="12" r="5" fill="#8ee8ff" stroke="none"/><path d="M5 24c0-9 6-14 13-18" stroke-dasharray="1 4.5"/></svg></span><span data-t="how1"></span></li>
      <li><span class="ic"><svg viewBox="0 0 28 28" fill="none" stroke="#f2f0ff" stroke-width="2.2" stroke-linecap="round"><path d="M6 23 22 5" stroke-dasharray="1 4.5"/><circle cx="6" cy="23" r="3" fill="#f2f0ff" stroke="none"/></svg></span><span data-t="how2"></span></li>
      <li><span class="ic"><svg viewBox="0 0 28 28" fill="#ffd166"><path d="M14 3l2.6 8.4L25 14l-8.4 2.6L14 25l-2.6-8.4L3 14l8.4-2.6z"/></svg></span><span data-t="how3"></span></li>
      <li><span class="ic"><svg viewBox="0 0 28 28" fill="none" stroke="#ff5d73" stroke-width="2.2" stroke-linecap="round"><path d="M3 20c3-3 5 3 8 0s5 3 8 0 4 2 6 0"/><path d="M14 14V5m-4 4 4-4 4 4"/></svg></span><span data-t="how4"></span></li>
    </ul>
    <button class="btn secondary" data-close="how" data-t="done"></button>
  </div>
</section>

<!-- Share fallback (browser) -->
<section id="share" class="layer sheet-wrap dim" hidden>
  <div class="sheet">
    <h2 data-t="share"></h2>
    <img class="card-img" id="shareImg" alt="">
    <p class="ov-best" data-t="shareHint"></p>
    <p class="share-text" id="shareText"></p>
    <button class="btn primary" id="btnCopy" data-t="copy"></button>
    <button class="btn secondary" data-close="share" data-t="done"></button>
  </div>
</section>

<script>
(function () {
'use strict';
// ───────── Kometa core: deterministic endless field + flight physics ─────────
const W = 1000;
const DT = 1 / 120;
const BAND = 40;          // graze band above a surface
const PICK = 42;          // star pickup radius
const ATT = 430;          // max gap at which a planet can be grabbed
const SECTOR = 9000;      // sector length in world units
const COMBO = 6;          // seconds a multiplier level lasts without a graze
const VLAG = 1000;        // the dark never falls further behind than this
const CUSHION = 26;       // height of the atmosphere cushion while a planet holds the comet
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function cruise(sec) { return Math.min(740, 430 + 24 * (sec - 1)); }
function darkSpeed(sec) { return cruise(sec) * Math.min(0.54, 0.34 + 0.025 * (sec - 1)); }
function sectorOf(y) { return Math.floor(Math.max(0, -y) / SECTOR) + 1; }

// ── field ──
function makeField(seed) {
  const F = { seed, rnd: mulberry32((seed ^ 0x9E3779B9) >>> 0), planets: [], stars: [], rocks: [], count: 0, nextY: -760, prev: null, secStars: {} };
  for (let i = 0; i < 4; i++) F.rnd();
  return F;
}
function addStar(F, x, y, sec) {
  if (x < 56 || x > W - 56) return;
  for (let i = F.stars.length - 1; i >= 0 && i > F.stars.length - 40; i--) {
    const s = F.stars[i];
    if (Math.abs(s.x - x) < 70 && Math.abs(s.y - y) < 70) return;
  }
  F.stars.push({ x, y, got: false, sec });
  F.secStars[sec] = (F.secStars[sec] || 0) + 1;
}
function genPlanet(F) {
  const rnd = F.rnd, i = F.count++, prev = F.prev;
  let y = F.nextY;
  const sec = sectorOf(y);
  let r = 54 + rnd() * 38;
  if (sec >= 4 && rnd() < 0.18) r = 102 + rnd() * 22;
  let x;
  if (i === 0) { x = 700; r = 72; }
  else {
    let tries = 0;
    do { x = 230 + rnd() * 540; } while (Math.abs(x - prev.x) < 230 && ++tries < 30);
    const need = r + prev.r + 270, dx = x - prev.x;
    if (need * need > dx * dx) y = Math.min(y, prev.y - Math.sqrt(need * need - dx * dx));
  }
  const p = { id: i, x, y, r, hue: Math.floor(rnd() * 6), ring: rnd() < 0.28, tilt: rnd() * 0.8 - 0.4, sec, loops: 0, moon: null };

  let ringR = r + 84 + rnd() * 36;
  if (i === 0) ringR = 200;
  if (sec >= 2 && i > 2 && rnd() < Math.min(0.6, 0.2 + 0.08 * sec)) {
    const R = r + 150 + rnd() * 30;
    const dir = rnd() < 0.5 ? -1 : 1, w = dir * (0.7 + rnd() * 0.5), ph = rnd() * TAU, mr = 15 + rnd() * 7;
    if (x - R > 24 && x + R < W - 24) { p.moon = { R, w, ph, r: mr }; ringR = Math.min(ringR, R - 56); }
  }
  // star arc around the planet
  const n = i === 0 ? 6 : 4 + Math.floor(rnd() * 3);
  const span = i === 0 ? TAU * (5 / 6) : TAU * (0.45 + rnd() * 0.4), a0 = i === 0 ? Math.PI : rnd() * TAU;
  for (let k = 0; k < n; k++) {
    const a = a0 + span * k / (n - 1);
    addStar(F, x + Math.cos(a) * ringR, y + Math.sin(a) * ringR, sec);
  }
  // a couple of stars on the way from the previous planet
  if (prev) {
    for (const t of [0.4, 0.6]) {
      const sx = prev.x + (x - prev.x) * t, sy = prev.y + (y - prev.y) * t;
      if (Math.hypot(sx - prev.x, sy - prev.y) > prev.r + 150 && Math.hypot(sx - x, sy - y) > r + 150) addStar(F, sx, sy, sec);
    }
    // rocks from sector 3: small hazards off the direct line
    if (sec >= 3 && rnd() < Math.min(0.7, 0.25 + 0.1 * (sec - 2))) {

    const grad = sk.c ? `linear-gradient(90deg,#fff,${sk.c[0]},${sk.c[1]})` : 'linear-gradient(90deg,#ff5d73,#ffd166,#6dffb0,#39e6ff,#8d63e8)';
    let info;
    if (openNow) info = `<small>${S.skin === sk.id ? t('chosen') : ''}</small>`;
    else { const v = Math.min(needValue(sk.need[0]), sk.need[1]); info = `<small>${needText(sk.need)}</small><span class="bar"><i style="width:${Math.round(v / sk.need[1] * 100)}%"></i></span>`; }
    b.innerHTML = `<span class="sw" style="background:${grad}"></span><b>${L.skin[sk.id]}</b>${info}`;
    if (openNow) b.addEventListener('click', () => { S.skin = sk.id; save(); setSkin(sk.id); tone(700, 0.1, 'triangle', 0.1); paintTails(); });
    else b.disabled = true;
    grid.appendChild(b);
  }
}

// ───────── input ─────────
function press() { if (G.state === 'play') { G.inputHold = true; audioInit(); } }
function release() { G.inputHold = false; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); G.pointers++; press(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} });
const up = e => { G.pointers = Math.max(0, G.pointers - 1); if (G.pointers === 0) release(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.sheet')) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); } else if (e.code === 'Escape' && G.state === 'play') pause(); });
window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });
function pause() { if (G.state !== 'play') return; G.state = 'paused'; G.inputHold = false; G.pointers = 0; open('pause'); }
function resume() { if (G.state !== 'paused') return; close('pause'); G.state = 'play'; last = performance.now(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => { G.inputHold = false; G.pointers = 0; });
function tap(id, fn) { $(id).addEventListener('click', () => { audioInit(); tone(620, 0.06, 'triangle', 0.08); fn(); }); }
tap('btnPlay', () => startRun('endless'));
tap('btnDaily', () => {
  syncDaily();
  if (S.daily.left > 0) startRun('daily');
  else doShare({ score: S.daily.best, sector: S.daily.sector, squares: S.daily.squares, mode: 'daily', end: S.daily.end }, G.dailyCard);
});
tap('btnTails', () => { paintTails(); open('tails'); });
tap('btnHow', () => open('how'));
tap('btnLang', () => { S.lang = S.lang === 'ru' ? 'en' : 'ru'; save(); paintTexts(); });
tap('btnSound', () => setMute(!S.mute));
tap('btnSound2', () => setMute(!S.mute));
tap('btnPause', pause);
tap('btnResume', resume);
tap('btnRestart', () => { close('pause'); if (G.mode === 'daily' && S.daily.left <= 0) startRun('endless'); else startRun(G.mode); });
tap('btnQuit', () => { close('pause'); startRun('demo'); show('home'); });
tap('btnAgain', () => { const m = G.res && G.res.mode === 'daily' && S.daily.left > 0 ? 'daily' : 'endless'; startRun(m); });
tap('btnHome', () => { startRun('demo'); show('home'); });
tap('btnShare', () => { if (!G.lastCard) { try { G.lastCard = renderCard(G.res); } catch (e) { G.lastCard = null; } } doShare(G.res, G.lastCard); });
tap('btnCopy', () => {
  const txt = $('shareText').textContent, ok = () => { $('btnCopy').textContent = t('copied'); };
  try { navigator.clipboard.writeText(txt).then(ok, () => selectText()); } catch (e) { selectText(); }
  function selectText() { try { const r = document.createRange(); r.selectNodeContents($('shareText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => close(b.dataset.close)));

// ───────── loop ─────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (G.state !== 'paused') { G.time += dt; if (G.state !== 'over' || G.parts.length) update(dt); }
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); setSkin(isOpen(SKINS.find(s => s.id === S.skin) || SKINS[0]) ? S.skin : 'ice');
startRun('demo'); paintTexts(); show('home');
// test hooks for the automated balance and screen checks
if (location.hash === '#test') window.__kometa = { G, S, startRun, finishRun, renderCard, open, paintTails, botDecide, paintTexts, setSkin };
requestAnimationFrame(frame);
})();

</script>
